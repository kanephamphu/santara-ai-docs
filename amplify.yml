# AWS Amplify Hosting build spec for docs.santara.ai.
#
# A STATIC build: `astro build` writes dist/ and Amplify serves it. There is no SSR adapter and
# no runtime, deliberately — see the note at the top of astro.config.mjs.
#
# DOCS_SITE_URL must be set in the Amplify environment (App settings → Environment variables) to
# the domain this branch serves, e.g. https://docs.santara.ai. It is what canonical URLs, the
# sitemap, llms.txt and every `Source:` line in the markdown mirrors are built from — a wrong
# value ships a site that points at the wrong host.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run verify:docs
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .astro/**/*
