name: Deploy santara-ai-docs

# Merging to `production` publishes docs.santara.ai.
#
# Four steps, in this order, and the order is the design:
#
#   1. VERIFY, then build. verify:docs fails on a dead link, a dead anchor, an untranslated page
#      or a diagram in the wrong locale. It costs a second and it is the only thing standing
#      between a bad merge and a broken manual, so it runs before anything touches AWS.
#   2. CloudFormation, twice — the certificate in us-east-1 (CloudFront takes it from nowhere
#      else), then the bucket and distribution in the main region with that ARN piped across.
#   3. Sync, uploading BEFORE deleting, so the site is never briefly missing a page. Content types
#      and cache headers are set here rather than in the template: `.md` must arrive as
#      text/markdown or the Copy-page button hands a reader a download prompt.
#   4. Invalidate, and WAIT. The green tick means the new page is actually being served, not that
#      an invalidation was requested.

on:
  push:
    branches: [production]
  workflow_dispatch:

# Two deploys at once would race on the same CloudFormation stack and, worse, on the same S3
# prefix — the second sync's --delete could remove objects the first had just uploaded.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # only used on the OIDC path below; harmless otherwise

jobs:
  deploy:
    name: Build & deploy (CloudFormation + S3 + CloudFront)
    runs-on: ubuntu-latest
    environment: production   # read environment-scoped secrets/variables

    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      DOCS_DOMAIN: ${{ vars.DOCS_DOMAIN || 'docs.santara.ai' }}
      CERT_STACK: ${{ vars.DOCS_CERT_STACK || 'santara-docs-certificate' }}
      SITE_STACK: ${{ vars.DOCS_SITE_STACK || 'santara-docs-site' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the docs
        # Dead links, dead anchors, missing translations, a diagram carrying another locale's
        # labels, frontmatter that would break the sidebar or llms.txt.
        run: npm run verify:docs

      - name: Build
        env:
          # ONE SOURCE OF TRUTH for the domain. Canonical URLs, the sitemap, llms.txt and the
          # `Source:` line in every markdown mirror are all built from this — set it wrong and
          # the site ships pointing at the wrong host, which no test catches.
          DOCS_SITE_URL: https://${{ env.DOCS_DOMAIN }}
        run: npm run build

      # ── AWS credentials ────────────────────────────────────────────────────────────────────
      # Two paths. Set the AWS_DEPLOY_ROLE_ARN environment variable and the job assumes a role
      # via GitHub's OIDC provider — no long-lived keys in the repo, and the preferred option.
      # Leave it unset and it falls back to access keys, matching the other Santara repos so
      # this workflow runs on day one without an IAM bootstrap.
      - name: Check the credentials are configured
        # configure-aws-credentials fails with "'aws-secret-access-key' must be provided if
        # 'aws-access-key-id' is provided" when half a key pair is set — which reads like a bug in
        # the workflow rather than a missing secret. Say what is actually wrong, and where.
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$ROLE" ]; then
            echo "Auth: OIDC role ($ROLE)"
            exit 0
          fi
          missing=""
          [ -z "$KEY_ID" ] && missing="$missing AWS_ACCESS_KEY_ID"
          [ -z "$SECRET" ] && missing="$missing AWS_SECRET_ACCESS_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — add them under" \
                 "Settings -> Environments -> production -> Secrets, or set the" \
                 "AWS_DEPLOY_ROLE_ARN variable to use OIDC instead."
            exit 1
          fi
          echo "Auth: access keys"

      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-santara-ai-docs
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Infrastructure ─────────────────────────────────────────────────────────────────────
      - name: Deploy certificate stack (us-east-1)
        env:
          HOSTED_ZONE_ID: ${{ vars.SANTARA_HOSTED_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${HOSTED_ZONE_ID}" ]; then
            echo "::error::SANTARA_HOSTED_ZONE_ID is not set. ACM validates by DNS, so without" \
                 "the hosted zone this stack would hang in CREATE_IN_PROGRESS until someone" \
                 "added a CNAME by hand."
            exit 1
          fi

          # us-east-1 is not a preference. CloudFront attaches certificates from that region only.
          aws cloudformation deploy \
            --region us-east-1 \
            --stack-name "$CERT_STACK" \
            --template-file infrastructure/certificate.yaml \
            --parameter-overrides \
              "DomainName=$DOCS_DOMAIN" \
              "HostedZoneId=$HOSTED_ZONE_ID" \
            --no-fail-on-empty-changeset \
            --tags project=santara-docs managed-by=github-actions

      - name: Deploy site stack
        env:
          HOSTED_ZONE_ID: ${{ vars.SANTARA_HOSTED_ZONE_ID }}
          PRICE_CLASS: ${{ vars.DOCS_PRICE_CLASS || 'PriceClass_200' }}
        run: |
          set -euo pipefail
          CERT_ARN=$(aws cloudformation describe-stacks \
            --region us-east-1 \
            --stack-name "$CERT_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue" \
            --output text)

          echo "Certificate: $CERT_ARN"

          aws cloudformation deploy \
            --stack-name "$SITE_STACK" \
            --template-file infrastructure/docs-site.yaml \
            --parameter-overrides \
              "DomainName=$DOCS_DOMAIN" \
              "CertificateArn=$CERT_ARN" \
              "HostedZoneId=$HOSTED_ZONE_ID" \
              "PriceClass=$PRICE_CLASS" \
            --no-fail-on-empty-changeset \
            --tags project=santara-docs managed-by=github-actions

      - name: Read stack outputs
        id: stack
        run: |
          set -euo pipefail
          read_output() {
            aws cloudformation describe-stacks --stack-name "$SITE_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          {
            echo "bucket=$(read_output BucketName)"
            echo "distribution=$(read_output DistributionId)"
            echo "url=$(read_output SiteUrl)"
          } >> "$GITHUB_OUTPUT"

      # ── Upload ─────────────────────────────────────────────────────────────────────────────
      - name: Sync to S3
        env:
          BUCKET: ${{ steps.stack.outputs.bucket }}
        run: |
          set -euo pipefail

          # Cache-Control for everything that is not content-hashed. CloudFront holds it for ten
          # minutes and the invalidation below cuts that short on deploy; browsers revalidate, so
          # a reader who reloads after a fix gets the fix.
          MUTABLE='public, max-age=0, s-maxage=600, must-revalidate'

          # 1. Hashed assets FIRST, and immutable for a year. Uploading them before the HTML means
          #    a page never lands referencing a stylesheet that is not there yet.
          if [ -d dist/_astro ]; then
            aws s3 sync dist/_astro/ "s3://$BUCKET/_astro/" \
              --cache-control 'public, max-age=31536000, immutable' \
              --no-progress
          fi

          # 2. Everything else, by type. Content types are set explicitly because the CLI's
          #    guesses are wrong where it matters most: `.md` is the markdown mirror behind every
          #    Copy-page button, and served as application/octet-stream a browser downloads it
          #    instead of showing it.
          aws s3 sync dist/ "s3://$BUCKET/" \
            --exclude '_astro/*' --exclude '*.html' --exclude '*.md' --exclude '*.txt' \
            --cache-control "$MUTABLE" --no-progress

          aws s3 sync dist/ "s3://$BUCKET/" --exclude '*' --include '*.html' \
            --content-type 'text/html; charset=utf-8' \
            --cache-control "$MUTABLE" --no-progress

          aws s3 sync dist/ "s3://$BUCKET/" --exclude '*' --include '*.md' \
            --content-type 'text/markdown; charset=utf-8' \
            --cache-control "$MUTABLE" --no-progress

          aws s3 sync dist/ "s3://$BUCKET/" --exclude '*' --include '*.txt' \
            --content-type 'text/plain; charset=utf-8' \
            --cache-control "$MUTABLE" --no-progress

          # 3. Remove what is no longer built — LAST, so nothing is ever missing mid-deploy. By
          #    now every local file matches its remote size, so this pass uploads nothing and the
          #    content types set above survive; it only deletes.
          aws s3 sync dist/ "s3://$BUCKET/" --delete --size-only --no-progress

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION: ${{ steps.stack.outputs.distribution }}
        run: |
          set -euo pipefail
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID"

          # Waiting is the point: without it the job goes green while edges still serve the old
          # page, and the next person to look reports the deploy as broken.
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION" --id "$ID"

      # ── Prove it ───────────────────────────────────────────────────────────────────────────
      - name: Smoke test the live site
        env:
          URL: ${{ steps.stack.outputs.url }}
        run: |
          set -euo pipefail
          check() {
            local path="$1" expect_type="$2"
            local out status type
            out=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' --max-time 20 "${URL%/}$path")
            status=${out%% *}
            type=${out#* }
            if [ "$status" != "200" ]; then
              echo "::error::${path} returned $status"
              return 1
            fi
            case "$type" in
              *"$expect_type"*) printf '  ok  %-34s %s\n' "$path" "$type" ;;
              *) echo "::error::${path} served as '$type', expected $expect_type"; return 1 ;;
            esac
          }

          # FIRST DEPLOY ONLY: the distribution has just been created and the Route 53 alias
          # has just been written, so the first request can land before either has settled.
          # Every later deploy passes this on the first try.
          for attempt in 1 2 3 4 5 6; do
            if curl -sSf -o /dev/null --max-time 20 "$URL"; then break; fi
            echo "  waiting for the edge to answer (attempt $attempt)…"
            sleep 20
          done

          # One page per locale, one markdown mirror, and the machine-readable indexes — the
          # things a misconfigured distribution breaks silently.
          check /                      text/html
          check /id/                   text/html
          check /vi/                   text/html
          check /channels/airbnb/      text/html
          check /channels/airbnb.md    text/markdown
          check /llms.txt              text/plain
          check /vi/llms-full.txt      text/plain
          check /robots.txt            text/plain

          # The trailing-slash redirect the CloudFront Function performs.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${URL%/}/channels/airbnb")
          [ "$code" = "301" ] || { echo "::error::/channels/airbnb should 301, got $code"; exit 1; }
          echo "  ok  301 on the un-slashed URL"

      - name: Summary
        if: always()
        run: |
          {
            echo "### docs.santara.ai"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Site | ${{ steps.stack.outputs.url }} |"
            echo "| Bucket | \`${{ steps.stack.outputs.bucket }}\` |"
            echo "| Distribution | \`${{ steps.stack.outputs.distribution }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
