<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 384" width="660" height="384" role="img" aria-label="Apa yang berpindah antara Santara dan channel">
  <title>Apa yang berpindah antara Santara dan channel</title>
  <rect x="16" y="16" width="150" height="328" rx="10" fill="var(--santara-surface, #f8f9fb)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <rect x="494" y="16" width="150" height="328" rx="10" fill="var(--santara-surface, #f8f9fb)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="91" y="46" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="650" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Santara</text>
  <text x="569" y="46" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="650" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Channel</text>
  <text x="569" y="66" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">Airbnb, Booking.com</text>
  <path d="M180 92 L472 92" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1.5" fill="none"/><path d="M471 87.5 L480 92 L471 96.5 Z" fill="var(--sl-color-text-accent, #1440e0)"/>
  <text x="330" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Ketersediaan dan tarif</text>
  <text x="330" y="112" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">termasuk minimum menginap dan restriksi — saat Anda menyimpan</text>
  <path d="M480 154 L172 154" stroke="var(--sl-color-gray-3, #5b6880)" stroke-width="1.5" fill="none"/><path d="M171 149.5 L180 154 L171 158.5 Z" fill="var(--sl-color-gray-3, #5b6880)"/>
  <text x="330" y="142" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Booking dan pembatalan</text>
  <text x="330" y="174" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">beserta tamu, pesan, dan ulasan</text>
  <path d="M480 216 L172 216" stroke="var(--sl-color-gray-3, #5b6880)" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><path d="M171 211.5 L180 216 L171 220.5 Z" fill="var(--sl-color-gray-3, #5b6880)"/>
  <text x="330" y="204" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Detail listing</text>
  <text x="330" y="236" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">sekali, saat impor: judul, foto, kapasitas, tarif</text>
  <path d="M180 278 L472 278" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><path d="M471 273.5 L480 278 L471 282.5 Z" fill="var(--sl-color-text-accent, #1440e0)"/>
  <text x="330" y="266" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Balasan Anda</text>
  <text x="330" y="298" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">ke pesan tamu, atau ke ulasan — saat Anda mengirimnya</text>
  <text x="330" y="370" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">Tidak ada yang lain. Deskripsi listing Anda tidak pernah diubah dari sini.</text>
</svg>
