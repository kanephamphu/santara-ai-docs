<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 534" width="690" height="534" role="img" aria-label="How a nightly price is worked out">
  <title>How a nightly price is worked out</title>
  <rect x="24" y="16" width="360" height="46" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="42" y="36" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">Base price</text>
  <text x="42" y="52" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">the rate plan's price, or the listing's base</text>
  <path d="M204 66 L204 81" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1.5" fill="none"/><path d="M199.5 80 L204 88 L208.5 80 Z" fill="var(--sl-color-gray-5, #d7dbe3)"/>
  <rect x="24" y="92" width="360" height="46" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="42" y="112" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">× season multiplier</text>
  <text x="42" y="128" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">×1.85 means 85% above base</text>
  <path d="M204 142 L204 157" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1.5" fill="none"/><path d="M199.5 156 L204 164 L208.5 156 Z" fill="var(--sl-color-gray-5, #d7dbe3)"/>
  <rect x="24" y="168" width="360" height="46" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="42" y="188" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">× day-of-week premium</text>
  <text x="42" y="204" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">scaled by that season's weekend strength</text>
  <path d="M204 218 L204 233" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1.5" fill="none"/><path d="M199.5 232 L204 240 L208.5 232 Z" fill="var(--sl-color-gray-5, #d7dbe3)"/>
  <rect x="24" y="244" width="360" height="46" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="42" y="264" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">Event override</text>
  <text x="42" y="280" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">replaces the season — the higher of the two wins</text>
  <path d="M204 294 L204 309" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1.5" fill="none"/><path d="M199.5 308 L204 316 L208.5 308 Z" fill="var(--sl-color-gray-5, #d7dbe3)"/>
  <rect x="24" y="320" width="360" height="46" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="42" y="340" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">Clamped: your floor and ceiling</text>
  <text x="42" y="356" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">automatic pricing never crosses them</text>
  <path d="M204 370 L204 385" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1.5" fill="none"/><path d="M199.5 384 L204 392 L208.5 384 Z" fill="var(--sl-color-gray-5, #d7dbe3)"/>
  <rect x="24" y="396" width="360" height="46" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="42" y="416" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">Clamped: what the channel accepts</text>
  <text x="42" y="432" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">narrows the range; never widens it</text>
  <path d="M204 446 L204 461" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1.5" fill="none"/><path d="M199.5 460 L204 468 L208.5 460 Z" fill="var(--sl-color-gray-5, #d7dbe3)"/>
  <rect x="24" y="472" width="360" height="46" rx="10" fill="var(--sl-color-accent-low, #dbe4ff)" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1"/>
  <text x="42" y="492" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="var(--sl-color-text-accent, #1440e0)" text-anchor="start">Published to your channels</text>
  <text x="42" y="508" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">if publish automatically is on</text>
  <rect x="424" y="16" width="180" height="46" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="440" y="36" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="var(--sl-color-text-accent, #1440e0)" text-anchor="start">A price you typed</text>
  <text x="440" y="52" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">skips every rule below</text>
  <path d="M514 62 L514 495 L392 495" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><path d="M393 490.5 L384 495 L393 499.5 Z" fill="var(--sl-color-text-accent, #1440e0)"/>
  <text x="508" y="88" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-text-accent, #1440e0)" text-anchor="end">unless you allow overwriting</text>
</svg>
