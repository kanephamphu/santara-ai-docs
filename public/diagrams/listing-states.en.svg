<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 436" width="620" height="436" role="img" aria-label="The four states of a listing">
  <title>The four states of a listing</title>
  <rect x="24" y="16" width="470" height="62" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="42" y="41" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">Not connected</text>
  <text x="42" y="61" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">No channel account is linked</text>
  <path d="M84 84 L84 111" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1.5" fill="none"/><path d="M79.5 110 L84 118 L88.5 110 Z" fill="var(--sl-color-gray-5, #d7dbe3)"/>
  <text x="102" y="106" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">automatic</text>
  <rect x="24" y="124" width="470" height="62" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="42" y="149" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">Linked — not mapped yet</text>
  <text x="42" y="169" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">We can see the listing. Nothing syncs.</text>
  <path d="M84 192 L84 219" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1.5" fill="none"/><path d="M79.5 218 L84 226 L88.5 218 Z" fill="var(--sl-color-gray-5, #d7dbe3)"/>
  <text x="102" y="214" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">automatic</text>
  <rect x="24" y="232" width="470" height="62" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="42" y="257" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">Mapped — awaiting activation</text>
  <text x="42" y="277" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">It points at a room. Still nothing syncs.</text>
  <line x1="16" y1="326" x2="502" y2="326" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M84 300 L84 345" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1.5" fill="none"/><path d="M79.5 344 L84 352 L88.5 344 Z" fill="var(--sl-color-text-accent, #1440e0)"/>
  <text x="102" y="316" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="var(--sl-color-text-accent, #1440e0)" text-anchor="start">You press Go live</text>
  <text x="102" y="344" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">Nothing crosses this line on its own</text>
  <rect x="24" y="358" width="470" height="62" rx="10" fill="var(--sl-color-accent-low, #dbe4ff)" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1"/>
  <text x="42" y="383" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="var(--sl-color-text-accent, #1440e0)" text-anchor="start">Live</text>
  <text x="42" y="403" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">Availability and rates out, bookings and messages in</text>
</svg>
