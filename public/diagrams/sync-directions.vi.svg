<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 384" width="660" height="384" role="img" aria-label="Cái gì di chuyển giữa Santara AI và một kênh">
  <title>Cái gì di chuyển giữa Santara AI và một kênh</title>
  <rect x="16" y="16" width="150" height="328" rx="10" fill="var(--santara-surface, #f8f9fb)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <rect x="494" y="16" width="150" height="328" rx="10" fill="var(--santara-surface, #f8f9fb)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="91" y="46" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="650" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Santara AI</text>
  <text x="569" y="46" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="650" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Kênh bán</text>
  <text x="569" y="66" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">Airbnb, Booking.com</text>
  <path d="M180 92 L472 92" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1.5" fill="none"/><path d="M471 87.5 L480 92 L471 96.5 Z" fill="var(--sl-color-text-accent, #1440e0)"/>
  <text x="330" y="80" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Tình trạng trống và giá</text>
  <text x="330" y="112" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">cả số đêm tối thiểu và ràng buộc — ngay khi bạn lưu</text>
  <path d="M480 154 L172 154" stroke="var(--sl-color-gray-3, #5b6880)" stroke-width="1.5" fill="none"/><path d="M171 149.5 L180 154 L171 158.5 Z" fill="var(--sl-color-gray-3, #5b6880)"/>
  <text x="330" y="142" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Đặt phòng và hủy</text>
  <text x="330" y="174" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">cùng với khách, tin nhắn và đánh giá</text>
  <path d="M480 216 L172 216" stroke="var(--sl-color-gray-3, #5b6880)" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><path d="M171 211.5 L180 216 L171 220.5 Z" fill="var(--sl-color-gray-3, #5b6880)"/>
  <text x="330" y="204" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Chi tiết listing</text>
  <text x="330" y="236" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">một lần, khi nhập: tiêu đề, ảnh, sức chứa, giá</text>
  <path d="M180 278 L472 278" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><path d="M471 273.5 L480 278 L471 282.5 Z" fill="var(--sl-color-text-accent, #1440e0)"/>
  <text x="330" y="266" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="middle">Phản hồi của bạn</text>
  <text x="330" y="298" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">cho tin nhắn khách, hoặc cho đánh giá — khi bạn gửi</text>
  <text x="330" y="370" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="middle">Không gì khác. Mô tả listing của bạn không bao giờ bị sửa từ đây.</text>
</svg>
