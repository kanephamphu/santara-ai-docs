  <text x="42" y="41" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">Belum terhubung</text>
  <text x="42" y="61" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">Belum ada akun channel yang tertaut</text>
