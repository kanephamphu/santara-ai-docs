  <path d="M84 192 L84 219" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1.5" fill="none"/><path d="M79.5 218 L84 226 L88.5 218 Z" fill="var(--sl-color-gray-5, #d7dbe3)"/>
  <text x="102" y="214" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">otomatis</text>
  <rect x="24" y="232" width="470" height="62" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="42" y="257" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">Dipetakan — menunggu aktivasi</text>
  <text x="42" y="277" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">Sudah menunjuk kamar. Tetap belum tersinkronisasi.</text>
  <line x1="16" y1="326" x2="502" y2="326" stroke="var(--sl-color-text-accent, #1440e0)" stroke-width="1" stroke-dasharray="4 4"/>
