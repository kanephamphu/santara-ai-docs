  <text x="102" y="316" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="var(--sl-color-text-accent, #1440e0)" text-anchor="start">Anda menekan Go live</text>
  <text x="102" y="344" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="var(--sl-color-gray-3, #5b6880)" text-anchor="start">Tidak ada yang melewati garis ini sendiri</text>
