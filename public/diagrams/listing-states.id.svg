  <rect x="24" y="124" width="470" height="62" rx="10" fill="var(--sl-color-bg, #ffffff)" stroke="var(--sl-color-gray-5, #d7dbe3)" stroke-width="1"/>
  <text x="42" y="149" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="var(--sl-color-white, #0b1930)" text-anchor="start">Tertaut — belum dipetakan</text>
